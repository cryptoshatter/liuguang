name: 打包 macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 设置版本号
        run: |
          V="0.2.${{ github.run_number }}"
          node -e 'const f="src-tauri/tauri.conf.json";const c=require("./"+f);c.version=process.argv[1];require("fs").writeFileSync(f,JSON.stringify(c,null,2)+"\n")' "$V"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: 打包并发布到 liuguang-releases
        if: env.RELEASES_TOKEN != '' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        with:
          owner: cryptoshatter
          repo: liuguang-releases
          tagName: v${{ env.APP_VERSION }}
          releaseCommitish: main
          releaseName: 流光 ${{ env.APP_VERSION }}
          releaseBody: 在流光里点「更新」即可；手动安装就把 dmg 里的流光拖进「应用程序」覆盖旧版，数据不受影响。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      - name: 只打包（还没配置发布密钥）
        if: env.RELEASES_TOKEN == '' || env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: npx tauri build --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: 整理产物
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: liuguang-dmg
          path: out/*.dmg
          retention-days: 30
